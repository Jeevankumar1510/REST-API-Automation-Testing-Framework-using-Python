[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --html=reports/report.html --self-contained-html
markers =
    smoke: Critical path smoke tests
    functional: Core CRUD and functional logic tests
    negative: Negative tests, boundary conditions, and invalid inputs
    auth: Authentication and token validation tests
    performance: API response time SLA tests
