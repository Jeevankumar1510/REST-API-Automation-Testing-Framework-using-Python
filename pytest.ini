[pytest]
# Pytest core settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Base execution options
addopts = 
    -v 
    --strict-markers
    --html=reports/report.html
    --self-contained-html

# Test markers for grouping and selective execution
markers =
    smoke: Critical path smoke tests for quick verification
    regression: Complete regression test suite
    functional: Core CRUD and functional business logic tests
    negative: Negative tests, boundary conditions, and invalid inputs
    auth: Authentication, authorization, and token lifecycle tests
    schema: JSON schema structure and contract validation tests
    performance: API response time and SLA verification tests

# Logging settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
